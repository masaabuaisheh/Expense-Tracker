<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Expense Tracker</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <header>
      <nav class="navbar bg-body-tertiary">
        <div
          class="container-fluid text-bg-dark rounded-top d-flex justify-content-between align-items-center"
        >
          <span class="navbar-brand h1 text-bg-dark m-3 fs-3">
            Expense Tracker
          </span>

          <button
            id="darkModeBtn"
            class="btn btn-outline-light me-3"
            type="button"
            aria-label="Toggle dark mode"
          >
            🌙
          </button>
        </div>
      </nav>
    </header>

    <main>
      <!-- Summary Cards -->
      <div class="container summary-cards mt-4">
        <div class="summary-grid">
          <!-- Total Amount -->
          <div class="card text-center h-100">
            <div class="card-body">
              <h5 class="card-title fs-6 fw-normal text-muted">Total</h5>

              <p class="card-text fs-1 fw-bold" id="totalAmount">0</p>
            </div>
          </div>

          <!-- Number of Expenses -->
          <div class="card text-center h-100">
            <div class="card-body">
              <h5 class="card-title fs-6 fw-normal text-muted">
                Number of expenses
              </h5>

              <p class="card-text fs-1 fw-bold" id="expensesCount">0</p>
            </div>
          </div>

          <!-- Highest Expense -->
          <div class="card text-center h-100">
            <div class="card-body">
              <h5 class="card-title fs-6 fw-normal text-muted">
                Highest expense
              </h5>

              <p class="card-text fs-1 fw-bold" id="highestAmount">0</p>

              <p class="card-text fs-6 fw-normal text-muted" id="highestTitle">
                -
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- Bar Chart -->
      <div class="container mt-4">
        <canvas id="myChart"></canvas>
      </div>

      <!-- Add Expense Form -->
      <div class="container mt-4 border rounded form">
        <form class="row g-3 p-4" id="expenseForm">
          <h3 class="title">Add expense</h3>

          <!-- Title -->
          <div class="col-12 col-md-4">
            <label for="inputTitle" class="form-label"> Title </label>

            <input
              type="text"
              class="form-control"
              id="inputTitle"
              placeholder="Lunch"
            />
            <span id="titleError" class="text-danger"></span>
          </div>

          <!-- Amount -->
          <div class="col-12 col-md-2">
            <label for="inputAmount" class="form-label"> Amount </label>

            <input
              type="number"
              class="form-control"
              id="inputAmount"
              placeholder="4.5"
              step="0.01"
            />
            <span id="amountError" class="text-danger"></span>
          </div>

          <!-- Category -->
          <div class="col-12 col-md-3">
            <label for="inputCategory" class="form-label"> Category </label>

            <select id="inputCategory" class="form-select">
              <option value="" selected disabled>Choose...</option>

              <option value="Food">Food</option>

              <option value="Transport">Transport</option>

              <option value="Bills">Bills</option>

              <option value="Entertainment">Entertainment</option>

              <option value="Other">Other</option>
            </select>
            <span id="categoryError" class="text-danger"></span>
          </div>

          <!-- Date -->
          <div class="col-12 col-md-3">
            <label for="inputDate" class="form-label"> Date </label>

            <input type="date" class="form-control" id="inputDate" />
            <span id="dateError" class="text-danger"></span>
          </div>

          <!-- Add Button -->
          <div class="col-12">
            <button type="submit" id="addBtn" class="btn btn-primary">
              Add expense
            </button>
          </div>
        </form>
      </div>

      <!-- Expenses Table + Filter -->
      <div class="container mt-4 border rounded epenses-section">
        <!-- Header -->
        <div class="row g-3 p-4 align-items-end">
          <h3 class="title col-12 mb-0">Expenses</h3>

          <!-- Search by Title -->
          <div class="col-12 col-md-5">
            <label for="searchInput" class="form-label">Search by Title</label>
            <input
              type="search"
              class="form-control"
              id="searchInput"
              placeholder="Search expenses..."
            />
          </div>

          <!-- Filter by Month -->
          <div class="col-12 col-md-4">
            <label for="monthFilter" class="form-label">Month</label>
            <input type="month" class="form-control" id="monthFilter" />
          </div>

          <!-- Filter by Category -->
          <div class="col-12 col-md-3">
            <label for="categoryFilter" class="form-label">Category</label>
            <select
              class="form-select"
              id="categoryFilter"
              aria-label="Filter by category"
            >
              <option value="All" selected>All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <!-- Table -->
        <div class="table-responsive p-3">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th id="thTitle">Title</th>
                <th class="text-end">Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>

            <tbody id="expensesTable">
              <!-- Expenses will be added here using JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <div id="alertContainer"></div>

    <div id="spinner" class="text-center my-3 d-none">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Edit Expense Modal -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="editModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">Edit Expense</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <!-- Title -->
            <div class="mb-3">
              <label for="editTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="editTitle" />
              <span id="editTitleError" class="text-danger"></span>
            </div>

            <!-- Amount -->
            <div class="mb-3">
              <label for="editAmount" class="form-label">Amount</label>
              <input
                type="number"
                class="form-control"
                id="editAmount"
                step="0.01"
              />
              <span id="editAmountError" class="text-danger"></span>
            </div>

            <!-- Category -->
            <div class="mb-3">
              <label for="editCategory" class="form-label">Category</label>

              <select class="form-select" id="editCategory">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>

              <span id="editCategoryError" class="text-danger"></span>
            </div>

            <!-- Date -->
            <div class="mb-3">
              <label for="editDate" class="form-label">Date</label>
              <input type="date" class="form-control" id="editDate" />
              <span id="editDateError" class="text-danger"></span>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button type="button" class="btn btn-primary" id="saveEditBtn">
              Save changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>

    <!-- JavaScript -->
    <script src="js/app.js"></script>
  </body>
</html>
